<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete News</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; }
        .container { max-width: 600px; margin: 80px auto; background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
        button { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        a { display: block; margin-top: 15px; text-align: center; text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Delete News Post</h2>
        <p>Are you sure you want to delete: <strong>{{ post.title }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, Delete Post</button>
        </form>

        <a href="{% url 'admin_news_list' %}">Cancel</a>
    </div>
</body>
</html>
