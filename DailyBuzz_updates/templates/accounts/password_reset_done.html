<!DOCTYPE html>
<html>
<head>
<title>Email Sent</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#00b894);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.card{
background:white;
padding:40px;
border-radius:14px;
max-width:420px;
text-align:center;
box-shadow:0 8px 30px rgba(0,0,0,0.2);
}

h2{
margin-top:0;
}

p{
color:#555;
}

a{
display:inline-block;
margin-top:20px;
background:#6c5ce7;
color:white;
padding:12px 20px;
border-radius:8px;
text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<h2>Check Your Email</h2>

<p>
We've sent a password reset link to your email.
</p>

<p>
Please check your inbox and follow the instructions.
</p>

<a href="{% url 'login' %}">
Back to Login
</a>

</div>

</body>
</html>
