<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Phone Change</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 18px;
            box-sizing: border-box;
        }
        button {
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .errorlist {
            color: red;
        }
        .msg {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verify Phone Change</h2>
        <p>Enter the 6-digit code sent to your current phone number.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="msg">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'verify_phone_change' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Verify and Change Phone Number</button>
        </form>
    </div>
</body>
</html>
