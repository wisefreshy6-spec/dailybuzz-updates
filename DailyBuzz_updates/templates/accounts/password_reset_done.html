<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Sent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }
        .card {
            max-width: 430px;
            margin: 60px auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Check your email</h2>
        <p>If an account exists with that email, a password reset link has been sent.</p>
        <p><a href="{% url 'login' %}">Back to login</a></p>
    </div>
</body>
</html>
