<!DOCTYPE html>
<html>
<head>
<title>Create New Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#00b894);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
padding:20px;
}

.card{
background:white;
padding:35px;
border-radius:14px;
width:100%;
max-width:420px;
box-shadow:0 10px 35px rgba(0,0,0,0.2);
}

h2{
margin-top:0;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:16px;
border-radius:8px;
border:1px solid #d1d5db;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#6c5ce7;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.errorlist{
color:#dc2626;
margin:0 0 12px 0;
padding-left:18px;
font-size:14px;
}

</style>

</head>

<body>

<div class="card">

<h2>Create New Password</h2>

{% if validlink %}

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">Update Password</button>

</form>

{% else %}

<p style="text-align:center;">
This password reset link is invalid or expired.
</p>

<p style="text-align:center;">
<a href="{% url 'password_reset' %}">
Request a new reset link
</a>
</p>

{% endif %}

</div>

</body>
</html>
