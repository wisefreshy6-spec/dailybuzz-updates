<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }
        .card {
            max-width: 430px;
            margin: 60px auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .errorlist {
            color: #dc2626;
            margin: 0 0 12px 0;
            padding-left: 18px;
        }
        .helptext {
            color: #6b7280;
            font-size: 13px;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset your password</h2>
        <p>Enter your email address and we will send you a password reset link.</p>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                {{ form.non_field_errors }}
            {% endif %}

            <label for="{{ form.email.id_for_label }}">Email address</label>
            {{ form.email }}

            {% if form.email.errors %}
                {{ form.email.errors }}
            {% endif %}

            <button type="submit">Send Reset Link</button>
        </form>

        <p style="margin-top:16px;">
            <a href="{% url 'login' %}">Back to login</a>
        </p>
    </div>
</body>
</html>
